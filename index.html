<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#24152f"><title>Semester Quest</title><style>body{margin:0;background:#f4eaff;color:#2c1938;font:16px system-ui,sans-serif}main{max-width:900px;margin:auto;padding:18px}.card{background:#fff9ff;border:2px solid #76508a;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 8px 0 #c6a8d5}h1{font-size:25px;margin:0;color:#704080}h2{font-size:18px;color:#704080}button{border:2px solid #513361;background:#ead8f5;border-radius:14px;padding:11px 14px;margin:4px;cursor:pointer}button.active{background:#9b68ad;color:white}.slot{display:grid;grid-template-columns:85px 1fr 34px;gap:8px;align-items:center;padding:10px;border-bottom:1px dashed #c6a8d5}.slot:nth-child(even){background:#fbf3ff}.check{width:25px;height:25px;accent-color:#9b68ad}.muted{color:#806d86}.timer{text-align:center;font-size:45px;font-weight:800;background:#24152f;color:#f7eaff;border-radius:18px;padding:22px}.tabs{display:flex;overflow:auto;white-space:nowrap}.tasks label{display:block;padding:10px;border-bottom:1px dashed #c6a8d5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:650px){main{padding:10px}.grid{grid-template-columns:1fr}.slot{grid-template-columns:68px 1fr 30px;font-size:15px}.timer{font-size:38px}}</style></head><body><main><div class="card"><h1>✦ 🪻 Semester Quest 🪻 ✦</h1><div class="muted">your tiny lavender control room for surviving midterms</div><div id="stats"></div></div><div class="tabs"><button class="active" onclick="show('today',this)">Today</button><button onclick="show('week',this)">Week</button><button onclick="show('tasks',this)">Quests</button><button onclick="show('timer',this)">Pomodoro</button></div><section id="today"><div class="card"><div id="days"></div><div id="schedule"></div></div><div class="card"><b>♡ Reality rule</b><p class="muted">Food, travel, friends, parents, showers and doing absolutely nothing are deliberately scheduled. You are not a study machine.</p></div></section><section id="week" style="display:none"><div class="card"><h2>🪻 Weekly map</h2><div id="weekly"></div></div></section><section id="tasks" style="display:none"><div class="grid"><div class="card"><h2>📚 Midterm quests</h2><div id="mid"></div></div><div class="card"><h2>✨ Side quests</h2><div id="side"></div></div></div></section><section id="timer" style="display:none"><div class="card"><h2>🍇 Pomodoro Garden</h2><div id="mode" style="text-align:center">FOCUS</div><div class="timer" id="clock">25:00</div><div style="text-align:center"><button onclick="start()">▶ Start</button><button onclick="pause()">Ⅱ Pause</button><button onclick="reset()">↻ Reset</button></div></div></section></main><script>
const D={Mon:[['06:45','Breakfast + get ready'],['07:30','Travel / buffer'],['08:00','CE331'],['09:00','Structural Mechanics — deep study'],['10:45','Break + friends'],['11:30','RC Structures'],['12:55','Lunch'],['13:45','Travel / reset'],['14:20','Geotech problems'],['15:30','Geotechnical Engineering II'],['17:25','Travel'],['17:45','Gym'],['18:45','Shower + decompress'],['20:00','Dinner'],['20:45','Light review'],['21:30','AVERERA'],['23:45','Sleep']],Tue:[['07:15','Breakfast'],['08:00','Travel + buffer'],['09:00','FEM'],['10:00','Transportation II'],['11:00','Environmental II'],['12:00','OE-1'],['12:55','Lunch'],['13:45','Travel / reset'],['14:20','FEM / MATLAB'],['15:30','Class block'],['17:25','Decompress'],['18:15','Optional Gym'],['20:00','Dinner'],['20:45','Paper/admin'],['21:30','AVERERA'],['23:45','Sleep']],Wed:[['07:15','Breakfast'],['08:00','Travel'],['09:00','FEM'],['10:00','Transportation II'],['11:00','Environmental II'],['12:00','OE-1'],['12:55','Lunch'],['13:45','Travel / reset'],['14:20','RC problems'],['15:30','Class block'],['17:25','Travel / snack'],['18:00','Hair wash + shower'],['20:00','Dinner'],['20:45','Paper work'],['21:45','DSA'],['22:30','Friends / parents'],['23:45','Sleep']],Thu:[['06:45','Breakfast + get ready'],['07:30','Travel'],['08:00','CE331'],['09:00','Geotech problems'],['10:45','Break'],['11:30','RC Structures'],['12:55','Lunch'],['13:45','Travel / reset'],['14:20','Structural Mechanics'],['15:30','Geotech II'],['17:25','Travel'],['17:45','Gym'],['18:45','Shower + decompress'],['20:00','Dinner'],['20:45','Formula review'],['21:30','AVERERA'],['23:45','Sleep']],Fri:[['07:15','Breakfast'],['08:00','Travel'],['09:00','FEM'],['10:00','Transportation II'],['11:00','Environmental II'],['12:00','OE-1'],['12:55','Lunch'],['13:45','Travel / reset'],['14:20','Structural Mechanics'],['15:30','Class block'],['17:25','Travel'],['17:45','Gym'],['18:45','Shower'],['20:00','Dinner'],['20:45','DSA / OA practice'],['22:15','Cold mails / paper admin'],['23:15','Friends / parents'],['23:45','Sleep']],Sat:[['07:30','Breakfast'],['08:15','Structural Mechanics'],['10:15','Break'],['10:45','RC + Geotech problems'],['12:45','Lunch'],['13:30','Paper work'],['15:00','Hair wash + shower'],['17:00','Kinetic prototype'],['18:00','Dinner out + friends'],['21:00','OFF — no guilt'],['23:30','Sleep']],Sun:[['07:30','Breakfast'],['08:15','Structural Mechanics'],['10:15','Break'],['10:45','RC Structures'],['12:15','Lunch'],['13:00','Geotech'],['14:30','Friends / parents'],['15:00','DSA'],['16:30','Break'],['17:00','Paper work'],['18:30','Cold mails'],['19:15','EMG / Quant'],['20:00','Dinner'],['20:45','Weekly review'],['21:30','Light revision'],['22:30','Free time'],['23:45','Sleep']]};
let day=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date().getDay()];let S=JSON.parse(localStorage.getItem('sq')||'{}');S.c=S.c||{};S.p=S.p||0;function save(){localStorage.setItem('sq',JSON.stringify(S));stats()}function stats(){document.getElementById('stats').textContent='☑ '+Object.values(S.c).filter(Boolean).length+' completed   🍅 '+S.p+' pomodoros'}function render(){document.getElementById('days').innerHTML=Object.keys(D).map(x=>`<button class="${x==day?'active':''}" onclick="day='${x}';render()">${x}</button>`).join('');document.getElementById('schedule').innerHTML=D[day].map((x,i)=>`<div class="slot"><span>${x[0]}</span><span>${x[1]}</span><input class="check" type="checkbox" ${S.c[day+i]?'checked':''} onchange="S.c['${day+i}']=this.checked;save()"></div>`).join('');stats()}function list(id,a,k){document.getElementById(id).innerHTML=a.map((x,i)=>`<label><input class="check" type="checkbox" ${S.c[k+i]?'checked':''} onchange="S.c['${k+i}']=this.checked;save()"> ${x}</label>`).join('')}list('mid',['Structural Mechanics — current unit + 10 problems','RC beams — singly/doubly reinforced','Geotech — earth pressure + bearing capacity','FEM — 1-D + MATLAB','Environmental — water + wastewater','Transportation — permanent way + geometry','Energy — solar + collectors + PV','OE-1 weekly revision'],'m');list('side',['AVERERA ×3','DSA ×4','Paper 1 deliverable','Paper 2 deliverable','Kinetic prototype','10–15 cold mails','EMG slow session','Quant slow session','Gym ×3','Hair ×2'],'s');document.getElementById('weekly').innerHTML=Object.keys(D).map(x=>`<p><b>${x}</b> — ${D[x].filter(y=>/Structural|Geotech|RC|FEM|DSA|Paper|Gym|AVERERA/.test(y[1])).slice(0,4).map(y=>y[1]).join(' · ')}</p>`).join('');function show(id,b){document.querySelectorAll('section').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}let t=1500,total=1500,run=null;function draw(){clock.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}function start(){if(run)return;run=setInterval(()=>{t--;draw();if(t<=0){clearInterval(run);run=null;S.p++;save();alert('Pomodoro complete ✦ take your break!');reset()}},1000)}function pause(){clearInterval(run);run=null}function reset(){pause();t=total;draw()}render();draw();stats();
</script></body></html>
